# Server defaults. Override networking through the launch arguments.
server.bind=127.0.0.1
server.port=5000

# Inclusive integer ranges; all accounts follow the same rules.
initial.cash.min=200
initial.cash.max=1000
initial.shares.min=0
initial.shares.max=10
price.min=20
price.max=50
orders.max=5

# Bot timing and quantity. Strategy percentages are documented in the README.
bot.delay.min.ms=1000
bot.delay.max.ms=3000
bot.quantity.max=3
bot.fallback.attempts=3
